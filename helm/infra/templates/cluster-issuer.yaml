apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "infra.clusterIssuerName" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    profile: tlsserver
    privateKeySecretRef:
      name: {{ .Values.privateKeySecretRef }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            labels: 
              {{- include "infra.labels" . | nindent 14 }}
            ## currently cert-manager provisions an invalid HTTPRoute when passing in parentRefs
            ## and specifying the specific Gateway listener
            # parentRefs:
            #   - name: {{ include "infra.gatewayName" . }}
            #     sectionName: {{ include "infra.solverHttpListener" . }}
            #     kind: Gateway