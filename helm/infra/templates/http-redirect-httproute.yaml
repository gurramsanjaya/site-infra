# Default redirect to https
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "infra.fullname" . }}-http-redirect-httproute
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "infra.gatewayName" . }}
      kind: Gateway
      sectionName: {{ include "infra.solverHttpListener" . }}
  rules:
    - filters:
      - type: RequestRedirect
        requestRedirect: 
          scheme: https